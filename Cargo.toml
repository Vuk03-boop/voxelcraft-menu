[package]
name = "voxelcraft"
version = "0.1.0"
edition = "2021"
default-run = "voxelcraft"

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
rayon = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rustc-hash = "2"
hashbrown = "0.17"
fastnoise-lite = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
ash = "0.38"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
criterion = "0.8"
fastnoise-lite = "1"

[[bench]]
name = "terrain"
harness = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1



